apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongo-auth-service-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: mmalabugin.ru
      http:
        paths:
          - path: /api/auth # Запросы на регистрацию/логин
            pathType: Prefix
            backend:
              service:
                name: mongo-auth-service
                port:
                  number: 80
          - path: /api/users # Запросы к профилю
            pathType: Prefix
            backend:
              service:
                name: mongo-auth-service
                port:
                  number: 80
  tls:
    - hosts:
        - mmalabugin.ru
      secretName: main-page-tls
